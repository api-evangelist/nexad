deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  detail: >-
    No published deprecation or sunset policy, and no RFC 8594 Sunset/Deprecation
    headers observed on live responses. Deprecation IS communicated, but only as
    prose inside the capability registry's action descriptions — which means a
    machine can find it, but only by reading descriptions. No dates, no removal
    schedule, and no supersession field. The one formal statement of support
    window in the whole surface is in the CLI's SECURITY.md: "Security fixes are
    applied to the latest published release on npm (@soku-ai/cli). Older versions
    are not maintained."
  supported_versions_statement: https://github.com/About-Intelligence/soku-cli/blob/main/SECURITY.md
deprecated_operations:
  source: cli/nexad-capabilities.json
  note: >-
    Actions the provider marks deprecated in the registry. The ChatGPT Ads
    "ad unit" model is the substantive one — it has been superseded by the
    Campaign -> Ad Group -> Ad object model, and the legacy actions are retained
    on the raw `soku call ads <action>` surface for existing campaigns only.
    `soku ads chatgpt campaign migrate-legacy` is the published migration path.
  operations:
    - id: action:ads/create_ad_unit
      status: deprecated
      reason: Legacy ChatGPT Ads ad-unit model, superseded by Campaign -> Ad Group -> Ad.
      replacement: action:ads/create_campaign with an inline ad-groups array
    - id: action:ads/generate_ad_units
      status: deprecated
      reason: Legacy ChatGPT Ads ad-unit model.
      replacement: generative ad groups on ads/create_ad_group
    - id: action:ads/add_campaign_ad_units
      status: deprecated
      reason: Legacy ChatGPT Ads ad-unit model.
      replacement: action:ads/create_ad
    - id: action:ads/replace_campaign_ad_units
      status: deprecated
      reason: Legacy ChatGPT Ads ad-unit model.
      replacement: authored Ad Groups + Ads
    - id: action:ads/archive_ad_unit
      status: deprecated
      reason: Legacy ChatGPT Ads ad-unit model.
      replacement: action:ads/archive_ad
    - id: action:ads/list_conversions
      status: deprecated
      reason: Deprecated alias.
      replacement: action:ads/list_conversion_groups
  migration_command: soku ads chatgpt campaign migrate-legacy
