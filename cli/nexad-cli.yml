name: Soku CLI
binary: soku
package: '@soku-ai/cli'
version: 0.1.0-alpha.17
license: MIT
repository: https://github.com/About-Intelligence/soku-cli
summary: >-
  Soku CLI gives shell-based AI agents (Claude Code, Codex, Cursor) trusted
  marketing data, focused Soku skills, covered third-party APIs via server-side
  egress, and review-gated write actions. It talks to Soku over /api/cli/*; no MCP
  host is required. Device-login auth; workspace/brand selection is remote and is
  explicitly NOT inferred from the local folder.
notes: >-
  Upgraded 2026-08-13. Nexad publishes no OpenAPI, so the CLI is not merely a
  convenience wrapper — it IS the documented contract for the Soku platform, and
  the machine-readable form of that contract is the capability registry the
  package ships at src/generated/capabilities.json. That file is saved verbatim in
  this repo as cli/nexad-capabilities.json and is the single richest artifact
  available for this provider: 281 actions across 18 namespaces, each with a
  description, a long_description, typed input_params (name/type/required/
  description/example), a declared output_shape, a read|write|risk mode, a
  requires_review flag, a synced|realtime freshness kind and a platform list.
  A live unauthenticated GET of https://api.soku.ai/api/cli/capabilities returns
  401 missing_bearer, confirming the registry is served by a real endpoint rather
  than existing only as a build artifact.
prerequisites:
  - Node.js 20 or newer
  - npm
install:
  - method: npm
    command: npm i -g @soku-ai/cli
authentication:
  scheme: oauth-device-flow
  standard: RFC 8628
  commands:
    - soku auth login
    - soku auth login --no-wait
    - soku auth login --device-code <device_code>
    - soku auth status
    - soku auth logout
  token_storage: OS keychain via keytar when available, otherwise ~/.soku/credentials.json (mode 0600)
  env: SOKU_TOKEN (preferred for CI and headless agents); SOKU_NO_KEYCHAIN=1 to bypass keychain waits
  authorization_model: >-
    No scope or resource model — the provider states a default login reaches the
    entire CLI surface. Authorization is enforced at runtime by the human review
    gate, not by token scope.
capability_surface:
