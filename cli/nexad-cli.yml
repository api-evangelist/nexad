    - {namespace: shopify, actions: 1, read: 1, write: 0, risk: 0, review_gated: 0}
command_groups:
  - group: update
    commands: [soku --version, soku update status, soku update cli, soku update skills]
    notes: >-
      `soku update cli` can silently refresh an installed meta skill as an npm
      postinstall side effect; its JSON result carries mustRereadMetaSkill:true and
      metaSkillRefreshed:[paths] when it did, and an agent is instructed to re-read
      the skill before continuing.
  - group: auth
    commands: [soku auth login, soku auth status, soku auth logout]
  - group: workspace
    commands: [soku workspace status, soku workspace resolve <brand>, soku workspace use-brand <brand>]
    notes: Never infer the Soku org/brand from the local repo directory.
  - group: skill
    commands: [soku skill list, soku skill install <slug> --global, soku skill status --global, soku skill list-installed --global]
    notes: Installed business skills carry a `soku-` prefix (e.g. soku-ads-report); tracked in .soku-skills.json.
  - group: ads (read)
    commands:
      - soku ads list-ad-accounts --platform google|meta|tiktok|chatgpt_ads
      - soku ads list-dimensions
      - soku ads query-single-dimension
      - soku ads query-multi-dimension
      - soku ads get-google-ads-report --report-type account|campaign|ad|keyword|search_term|bidding_strategy
      - soku ads get-resource-metadata
      - soku ads gaql-search
    notes: >-
      Cached-first. Use query-single-dimension for CPA/ROAS/conversion fan-out;
      query-multi-dimension for raw breakdowns (not supported for chatgpt_ads).
      gaql-search takes structured dimensions/metrics/filters — never raw
      SELECT..FROM GAQL.
  - group: ads (write)
    commands:
      - soku ads meta campaign|adset|creative|ad create|activate|pause|bulk-create
      - soku ads meta asset upload-images
      - soku ads meta account pages|instagram
      - soku ads google campaign|ad-group|ad|keyword
      - soku ads chatgpt account|campaign|ad-group|ad
      - soku ads chatgpt campaign migrate-legacy
    notes: >-
      Most delivery-changing writes are review-gated and require --summary.
      Creates are forced PAUSED by the backend; activation is a separate
      review-gated action. Bulk items each need a unique client_ref.
  - group: analytics
    commands: [soku ga4 --help, soku gsc --help, soku posthog --help, soku bigquery --help]
    notes: GA4 (10 actions), Google Search Console (7), PostHog (4, read-allowlisted tools), BigQuery (4, dry_run byte estimate available).
  - group: commerce
    commands: [soku shopify --help, soku shoplazza --help, soku doordash --help, soku ubereats --help, soku toast --help]
    notes: Read-only commerce/delivery connectors.
  - group: attribution
    commands: [soku adjust --help, soku appsflyer --help, soku sprout --help]
    notes: Mobile attribution (Adjust, AppsFlyer) and social (Sprout Social); reads allowlisted, changes via request_change.
  - group: egress
    commands: [soku egress providers, 'soku egress -- curl ...']
    notes: >-
      Covered third-party APIs with credentials injected server-side. A successful
      upstream response is returned VERBATIM on stdout, not wrapped in the CLI
      envelope. An unset local key env var is expected — never guard on it.
  - group: seo-hosting
    commands: [soku seo-hosting status, put-page, publish-page, unpublish-page, delete-page, get-sections, put-sections, upload-asset, set-domain-sections, reprovision-domain]
    notes: >-
      Direct-write surface (11 actions, none review-gated) requiring explicit user
      confirmation. Use --cf-token-env / --cf-token-stdin for Cloudflare tokens.
  - group: org
    commands: [soku org get-overview, get-usage-summary, list-activity, list-brands]
  - group: review
    commands: [soku review list, soku review show <id>, soku review approve <id>]
    notes: >-
      The human gate. Approval is single-use and a failed approval is terminal.
      Never allowlist or auto-approve. Bulk reviews execute asynchronously — poll
      with `soku review show`.
  - group: raw
    commands: ['soku call <namespace> <action> -p k=v', 'soku call <ns> <action> --payload ''{...}''']
    notes: Forward-compatible escape hatch for actions with no typed command. Review-gated writes via `soku call` still require --summary.
exit_codes:
  0: Success
  1: Usage error or no workspace
  2: Auth missing, expired or revoked
  4: Not found or unknown capability
  5: Runtime or network failure
output:
  non_tty_success: '{"ok": true, "data": ...}'
  non_tty_error: '{"ok": false, "error": ...}'
key_flows:
  - Install/update CLI -> device login -> select remote workspace/brand -> install task-scoped skills -> discover namespaces -> run a read-only performance health check.
  - Discover -> inspect (`--help` is the authoritative runtime surface) -> run. Never guess flags; object/list flags take JSON strings.
  - Meta ad build: list-ad-accounts -> upload-images (immediate, returns image_hash) -> campaign create -> adset create -> creative create -> ad create, each write returning a review id for human approval.
safety:
  - Never prints or persists the Soku access token.
  - Never asks the user to paste third-party provider keys for covered providers.
  - Ads writes are review-gated; SEO Hosting is a direct-write surface requiring confirmation.
  - Pass user-provided values as separate argv elements; never string-concatenate into a shell command.
  - Treat verification_uri, signed URLs, review ids and provider URLs as opaque strings.
