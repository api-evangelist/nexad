  namespaces: 18
  modes: {read: 149, write: 74, risk: 58}
  review_gated: 124
  freshness: {synced: 165, realtime: 116}
  naming:
    typed_commands: kebab-case
    registry_actions: snake_case
    action_id_form: 'action:<namespace>/<action>'
  namespaces_detail:
