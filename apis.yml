aid: nexad
name: Nexad
description: >-
  Nexad (About Intelligence, Inc.) is an AI-native advertising company backed by
  Andreessen Horowitz, Point72 and Prosus. It ships the Nexad Android Ads SDK — a
  Java/Kotlin library for embedding contextual, native, WebView, chat-message, and
  modal-overlay ads directly into mobile and AI-chat applications — and operates
  Soku AI, an autonomous marketing agent (the NexStudio API at api.soku.ai) that
  runs and optimizes ad campaigns across Google, Meta, TikTok, and ChatGPT Ads on
  a 24/7 perceive–decide–act loop with human-in-the-loop approvals. Developers
  integrate via the Android SDK, the Soku CLI (@soku-ai/cli) for shell-based AI
  agents such as Claude Code, Codex, and Cursor, an authenticated MCP endpoint at
  api.soku.ai/mcp, and an open-source marketing skills hub. Nexad publishes no
  OpenAPI, but it does ship an unusually complete machine-readable substitute: a
  281-action capability registry (18 namespaces) in its public MIT-licensed
  soku-cli repository, where every action declares typed inputs, an output shape,
  a read/write/risk mode and a requires_review flag — 124 of the 281 actions are
  human-approval-gated at runtime.
