aid: nexad
name: Nexad
description: >-
  Nexad (About Intelligence, Inc.) is an AI-native advertising company backed by
  Prosus Ventures. It ships the Nexad Android Ads SDK — a Java/Kotlin library for
  embedding contextual, native, WebView, chat-message, and modal-overlay ads
  directly into mobile and AI-chat applications — and operates Soku AI, an
  autonomous marketing agent (the NexStudio API at api.soku.ai) that runs and
  optimizes ad campaigns across Google, Meta, TikTok, and ChatGPT Ads on a 24/7
  perceive–decide–act loop with human-in-the-loop approvals. Developers integrate
  via the Android SDK, the Soku CLI (@soku-ai/cli) for shell-based AI agents such
  as Claude Code, Codex, and Cursor, an authenticated MCP endpoint, and a hub of
  100+ open-source marketing skills.
